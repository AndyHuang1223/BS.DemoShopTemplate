services:
  demoshop.web:
    image: demoshop.web
    build:
      context: .
      dockerfile: DemoShop.Web/Dockerfile
    ports:
      - "8800:80"
    environment: &app_env
      ASPNETCORE_URLS: http://+:80
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BSDemoShopConnection: Server=sql-server-db;User Id=sa;Password=${SA_PASSWORD};Database=BSDemoShopCatalog;Trusted_Connection=False;TrustServerCertificate=True;
      ConnectionStrings__Redis: redis:6379
    depends_on:
      sql-server-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - demoshop-network

  demoshop.admin:
    image: demoshop.admin
    build:
      context: .
      dockerfile: DemoShop.Admin/Dockerfile
    ports:
      - "8801:80"
    environment: *app_env
    depends_on:
      sql-server-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - demoshop-network

  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    #    當SQL Server需要對外開放port時，可將下面的註解拿掉，否則就是用Docker內部網路的方式
    #    ports:
    #      - "1434:1433"
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: "Developer"
    volumes:
      - demoshop-db:/var/opt/mssql
      - ./db:/usr/config
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD}' -Q 'SELECT 1' -C || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - demoshop-network

  # 初始化資料庫（建議只跑一次）
  db-init:
    image: mcr.microsoft.com/mssql-tools
    platform: linux/amd64
    depends_on:
      sql-server-db:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./db:/usr/config
    command: /bin/bash -c "/opt/mssql-tools/bin/sqlcmd -S sql-server-db -U sa -P '${SA_PASSWORD}' -i /usr/config/initDb.sql -C"
    networks:
      - demoshop-network

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - demoshop-redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - demoshop-network

volumes:
  demoshop-db:
  demoshop-redis:

networks:
  demoshop-network:
